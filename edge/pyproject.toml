[project]
name = "vigilado-edge"
version = "0.1.0"
description = "Vigilado: motor de visión que se ejecuta en el equipo de la tienda"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "pyyaml>=6"]

[project.optional-dependencies]
modelo = ["rtmlib>=0.0.13", "onnxruntime>=1.17"]
gpu = ["rtmlib>=0.0.13", "onnxruntime-gpu>=1.17"]
dev = ["pytest>=8"]

[project.scripts]
vigilado-edge = "vigilado_edge.principal:main"

[tool.setuptools]
packages = ["vigilado_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
